name: Pelican rides packages

# 每次 push 构建安卓 debug APK 和未签名 iOS 真机 IPA。
# 推送标签 pelican-rides-v*（例如 pelican-rides-v0.1.0）时，把两个包发到 GitHub Release。
# 默认路径不使用 Apple 证书或仓库密钥。IPA 不是 App Store / TestFlight 包。

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pelican-rides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT is not set on this runner" >&2
            exit 1
          fi
          sdkmanager="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $ANDROID_SDK_ROOT" >&2
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor Android
        run: npm run cap:sync

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name sideload APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pelican-rides-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pelican-rides-debug
          path: pelican-rides-debug.apk
          if-no-files-found: error

  ios-unsigned:
    name: iOS unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor iOS
        run: npm run cap:sync:ios

      - name: Build unsigned IPA
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
        run: ./scripts/build-unsigned-ipa.sh "$PWD/pelican-rides.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: pelican-rides-ipa
          path: pelican-rides.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android-debug, ios-unsigned]
    if: startsWith(github.ref, 'refs/tags/pelican-rides-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Stage release files
        run: |
          set -euo pipefail
          find release-assets -type f -print
          mkdir -p release-dist
          apk="$(find release-assets -type f -name 'pelican-rides-debug.apk' -print -quit)"
          ipa="$(find release-assets -type f -name 'pelican-rides.ipa' -print -quit)"
          if [ -z "$apk" ] || [ -z "$ipa" ]; then
            echo "缺少 APK 或 IPA" >&2
            exit 1
          fi
          cp "$apk" release-dist/pelican-rides-debug.apk
          cp "$ipa" release-dist/pelican-rides.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          # 鹈鹕骑车 ${tag}

          这是侧载安装包，不是 App Store，也不是 TestFlight。

          - \`pelican-rides-debug.apk\`：安卓调试包。在手机上允许未知来源后安装。
          - \`pelican-rides.ipa\`：未签名 iOS 包（构建时 \`CODE_SIGNING_ALLOWED=NO\`）。用 SideStore 或 AltStore 和你自己的免费 Apple ID 重签后安装。

          安装步骤见 [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/INSTALL.md)。

          免费 Apple ID 的签名大约 7 天后过期，需要在 SideStore 或 AltStore 里刷新。这个仓库没有配置 Apple 证书。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              release-dist/pelican-rides-debug.apk \
              release-dist/pelican-rides.ipa \
              --clobber
            gh release edit "$tag" --title "鹈鹕骑车 ${tag}" --notes-file "$notes"
          else
            gh release create "$tag" \
              release-dist/pelican-rides-debug.apk \
              release-dist/pelican-rides.ipa \
              --title "鹈鹕骑车 ${tag}" \
              --notes-file "$notes"
          fi
